<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
  <title>Page not found | Shadman Khan Khattak</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet" />
  <script>
    // Use the theme picked on the portfolio, if any
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <style>
    /* Same palette and type as src/styles/tokens.css; keep the two in step */
    :root {
      --paper: #f4f2ed;
      --ink: #161513;
      --ink-2: #4f4b44;
      --ink-3: #6d685f;
      --rule: #d9d5cc;
      --signal: #c2410c;
      --on-signal: #fff8f3;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #111110;
        --ink: #ece8df;
        --ink-2: #b3ada2;
        --ink-3: #8f897f;
        --rule: #2a2826;
        --signal: #ff6a2b;
        --on-signal: #1a0a02;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --paper: #111110;
      --ink: #ece8df;
      --ink-2: #b3ada2;
      --ink-3: #8f897f;
      --rule: #2a2826;
      --signal: #ff6a2b;
      --on-signal: #1a0a02;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 40rem;
      padding: 3rem clamp(1rem, 0.5rem + 2.5vw, 2.5rem);
    }

    .code {
      margin: 0 0 1.5rem;
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .code span {
      color: var(--signal);
    }

    h1 {
      margin: 0 0 1.25rem;
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 1.6rem + 4.2vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.025em;
    }

    h1 em {
      color: var(--signal);
    }

    p {
      color: var(--ink-2);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0 1.5rem;
      border: 1px solid var(--ink);
      border-radius: 2px;
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      font-size: 0.875rem;
      text-decoration: none;
    }

    a:hover,
    a.primary {
      background: var(--ink);
      color: var(--paper);
    }

    a.primary:hover {
      background: var(--signal);
      border-color: var(--signal);
      color: var(--on-signal);
    }

    a:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code"><span>404</span> · Page not found</p>
    <h1>This page <em>didn't ship.</em></h1>
    <p>The address may be mistyped, or the page may have moved. Everything on the site is reachable from the home page.</p>
    <div class="links">
      <a class="primary" href="/">Go to the portfolio</a>
      <a href="/#work">See the games</a>
    </div>
  </main>
</body>
</html>
