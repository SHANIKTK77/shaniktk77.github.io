<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#eeebe3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />
  <title>Page not found | Shadman Khan Khattak</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script>
    // Use the theme picked on the portfolio, if any
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <style>
    /* Same palette and type as src/styles/tokens.css; keep the two in step.
       The idea: a missing page is a missing asset, so it gets the engine's magenta
       missing-texture checkerboard, with the message on a plate in front of it. */
    :root {
      --paper: #eeebe3;
      --ink: #121314;
      --ink-2: #45474b;
      --ink-3: #5f6267;
      --rule: #d2cdc1;
      --signal: #b33a0a;
      --on-signal: #fff8f3;
      --missing: #ff00ff;
      --missing-dark: #000000;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #0c0d0f;
        --ink: #ecebe6;
        --ink-2: #b2b4b8;
        --ink-3: #8a8e94;
        --rule: #23262b;
        --signal: #ff7a1a;
        --on-signal: #170a00;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --paper: #0c0d0f;
      --ink: #ecebe6;
      --ink-2: #b2b4b8;
      --ink-3: #8a8e94;
      --rule: #23262b;
      --signal: #ff7a1a;
      --on-signal: #170a00;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 0.25rem + 3vw, 3rem);
      background-color: var(--missing);
      background-image: conic-gradient(var(--missing-dark) 25%, transparent 0 50%, var(--missing-dark) 0 75%, transparent 0);
      background-size: 64px 64px;
      color: var(--ink);
      font-family: "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      animation: scroll 6s linear infinite;
    }

    /* The checkerboard creeps along, like a texture with a broken UV scroll */
    @keyframes scroll {
      to {
        background-position: 64px 64px;
      }
    }

    main {
      width: 100%;
      max-width: 42rem;
      padding: clamp(1.5rem, 1rem + 3vw, 3rem);
      background: var(--paper);
      border: 1px solid var(--ink);
    }

    .code {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 2rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--rule);
      font-family: "Geist Mono", ui-monospace, Menlo, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .code span {
      color: var(--signal);
    }

    h1 {
      margin: 0 0 1.25rem;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3rem, 1.6rem + 6vw, 5.5rem);
      line-height: 0.9;
      letter-spacing: -0.035em;
    }

    h1 em {
      color: var(--signal);
    }

    p {
      color: var(--ink-2);
    }

    .log {
      margin: 1.5rem 0 0;
      padding: 0.75rem 1rem;
      background: var(--ink);
      color: var(--paper);
      font-family: "Geist Mono", ui-monospace, Menlo, monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .log b {
      color: var(--missing);
      font-weight: 500;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 3rem;
      padding: 0 1.5rem;
      border: 1px solid var(--ink);
      color: var(--ink);
      font-family: "Geist Mono", ui-monospace, Menlo, monospace;
      font-size: 0.8125rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
    }

    a:hover,
    a.primary {
      background: var(--ink);
      color: var(--paper);
    }

    a.primary:hover {
      background: var(--signal);
      border-color: var(--signal);
      color: var(--on-signal);
    }

    a:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        animation: none;
      }
    }

    @media (max-width: 480px) {
      a {
        flex: 1 1 auto;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="code"><span>404</span> Page not found <span aria-hidden="true">Missing asset</span></p>
    <h1>This page <em>didn't ship.</em></h1>
    <p>The address may be mistyped, or the page may have moved. Everything on the site is reachable from the home page.</p>
    <p class="log" id="log"><b>Missing reference:</b> the requested page could not be found in this build.</p>
    <div class="links">
      <a class="primary" href="/">Go to the portfolio</a>
      <a href="/#work">See the games</a>
    </div>
  </main>
  <script>
    // Name the missing path in the log line, the way an engine names the missing asset
    try {
      var log = document.getElementById("log");
      log.lastChild.textContent = " " + decodeURIComponent(location.pathname) + " could not be found in this build.";
    } catch (e) {}
  </script>
</body>
</html>
